name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CI: true
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 13316
      MYSQL_USER: atlas_audit
      MYSQL_PASSWORD: synthetic-ci-database-only
      MYSQL_DATABASE: atlas_audit_test
      MYSQL_SSL: false
      ALLOW_TEST_DATABASE: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: atlas_audit_test
          MYSQL_USER: atlas_audit
          MYSQL_PASSWORD: synthetic-ci-database-only
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-only
        ports:
          - 13316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run lint:ci
      - run: npm run typecheck:ci
      - run: npm run test:cov
      - run: npm run build
      - run: npm run prisma:deploy
      - run: npm run test:integration
      - run: test -s coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-build
          path: backend/dist/
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      VITE_API_URL: http://127.0.0.1:13317/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:ci
      - run: npm run typecheck:ci
      - run: npm run test:cov
      - run: npm run build
      - run: test -s coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        application: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.application }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.application }}

  e2e:
    name: Critical flows E2E
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 13316
      MYSQL_USER: atlas_audit
      MYSQL_PASSWORD: synthetic-ci-database-only
      MYSQL_DATABASE: atlas_audit_test
      MYSQL_SSL: false
      ALLOW_TEST_DATABASE: true
      JWT_ACCESS_SECRET: synthetic-e2e-access-secret-atlas-only
      JWT_REFRESH_SECRET: synthetic-e2e-refresh-secret-atlas-only
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: atlas_audit_test
          MYSQL_USER: atlas_audit
          MYSQL_PASSWORD: synthetic-ci-database-only
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-only
        ports:
          - 13316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-build
          path: backend/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend/dist
      - run: npm run prisma:deploy
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run typecheck:e2e
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: SonarCloud Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Check prerequisites
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo '::error::Configure SONAR_TOKEN and disable Automatic Analysis in SonarCloud.'; exit 1; }
          test -s backend/coverage/lcov.info
          test -s frontend/coverage/lcov.info
          sed -i 's|^SF:|SF:backend/|' backend/coverage/lcov.info
          sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      - name: Verify new code coverage policy
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo 'Resolving the project through SonarCloud API v2.'
          curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer $SONAR_TOKEN" \
            --data-urlencode 'keys=BevilacquaJulio_atlas_stock_novo' \
            --output "$RUNNER_TEMP/sonar-project.json" \
            'https://api.sonarcloud.io/projects/projects' || {
              echo '::error::SonarCloud project lookup failed. Check token authentication and project access.'
              jq -r '.message // .error // "No API error message available."' "$RUNNER_TEMP/sonar-project.json"
              exit 1
            }
          project_id=$(jq -er '.projects[] | select(.key == "BevilacquaJulio_atlas_stock_novo") | .id' "$RUNNER_TEMP/sonar-project.json")
          echo 'Checking the project small-change policy through SonarCloud API v2.'
          curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer $SONAR_TOKEN" \
            --data-urlencode "resourceId=$project_id" \
            --data-urlencode 'resourceType=PROJECT' \
            --output "$RUNNER_TEMP/sonar-settings.json" \
            'https://api.sonarcloud.io/quality-gates/settings' || {
              echo '::error::SonarCloud Quality Gate settings lookup failed. Check token permissions.'
              jq -r '.message // .error // "No API error message available."' "$RUNNER_TEMP/sonar-settings.json"
              exit 1
            }
          jq -e --arg project_id "$project_id" '.resourceId == $project_id and .resourceType == "PROJECT" and .ignoreSmallChanges == false' "$RUNNER_TEMP/sonar-settings.json" \
            || { echo '::error::Disable Ignore duplication and coverage on small changes in SonarCloud.'; exit 1; }
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $SONAR_TOKEN" \
            --data-urlencode 'project=BevilacquaJulio_atlas_stock_novo' \
            --data-urlencode 'organization=bevilacquajulio' \
            --output "$RUNNER_TEMP/sonar-project-gate.json" \
            'https://sonarcloud.io/api/qualitygates/get_by_project'
          gate_id=$(jq -er '.qualityGate.id' "$RUNNER_TEMP/sonar-project-gate.json")
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $SONAR_TOKEN" \
            --data-urlencode "id=$gate_id" \
            --data-urlencode 'organization=bevilacquajulio' \
            --output "$RUNNER_TEMP/sonar-gate.json" \
            'https://sonarcloud.io/api/qualitygates/show'
          jq -e '.conditions | any(.metric == "new_coverage" and .op == "LT" and (.error | tonumber) >= 80)' "$RUNNER_TEMP/sonar-gate.json" \
            || { echo '::error::The Quality Gate must require at least 80% coverage on new code.'; exit 1; }
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  required:
    name: CI Required
    if: ${{ always() }}
    needs: [backend, frontend, audit, e2e, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          AUDIT: ${{ needs.audit.result }}
          E2E: ${{ needs.e2e.result }}
          SONAR: ${{ needs.sonar.result }}
        run: |
          for result in "$BACKEND" "$FRONTEND" "$AUDIT" "$E2E" "$SONAR"; do
            if [ "$result" != success ]; then
              echo '::error::A mandatory validation failed, was cancelled or did not run.'
              exit 1
            fi
          done
