services:
  # ─────────────────────────── API (NestJS) ───────────────────────────
  api:
    image: bl_atlas_stock-api
    build: ./backend
    container_name: bl_g5-api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: "3000"
      MYSQL_HOST: ${MYSQL_HOST:-mysql_shared}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Configure MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      MYSQL_SSL: ${MYSQL_SSL:-true}
      MYSQL_SSL_REJECT_UNAUTHORIZED: ${MYSQL_SSL_REJECT_UNAUTHORIZED:-true}
      MYSQL_SSL_CA_PATH: ${MYSQL_SSL_CA_PATH:-/run/secrets/mysql-ca.pem}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      REQUIRE_PRIVILEGED_MFA: ${REQUIRE_PRIVILEGED_MFA:-false}
      COOKIE_SECURE: "true"
      CORS_ORIGIN: https://${DOMAIN}
      TRUST_PROXY: ${TRUST_PROXY:-}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
    volumes:
      - ./secrets/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
    networks:
      - mysql_shared
      - traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.g5_api.rule=Host(`api.${DOMAIN}`)"
      - traefik.http.routers.g5_api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.g5_api.tls=true
      - traefik.http.routers.g5_api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.g5_api.loadbalancer.server.port=3000
    mem_limit: 512m
    cpus: 0.75

  # ─────────────────────── Frontend (React/Vite) ──────────────────────
  app:
    image: bl_atlas_stock-app
    build:
      context: ./frontend
      args:
        # VITE_* e compilado no build (build-time). Aponta para a API publica.
        VITE_API_URL: https://api.${DOMAIN}/api
    container_name: bl_g5-app
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.g5_web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.g5_web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.g5_web.tls=true
      - traefik.http.routers.g5_web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.g5_web.loadbalancer.server.port=8080
    mem_limit: 128m
    cpus: 0.25

  # ─────────────── Migrator one-off (Prisma migrate deploy) ────────────
  # Nao sobe com `up` (profile "tools"). Usa o stage de build do backend,
  # que tem a CLI do Prisma + schema + migrations. Roda manualmente:
  #   docker compose run --rm migrate
  migrate:
    image: bl_atlas_stock-migrate
    container_name: bl_g5-migrate
    build:
      context: ./backend
      target: build
    environment:
      MYSQL_USER: ${MYSQL_MIGRATE_USER:?Configure MYSQL_MIGRATE_USER}
      MYSQL_PASSWORD: ${MYSQL_MIGRATE_PASSWORD:?Configure MYSQL_MIGRATE_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST:-mysql_shared}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure MYSQL_DATABASE}
      MYSQL_SSL: ${MYSQL_SSL:-true}
      MYSQL_SSL_REJECT_UNAUTHORIZED: ${MYSQL_SSL_REJECT_UNAUTHORIZED:-true}
      MYSQL_SSL_CA_PATH: ${MYSQL_SSL_CA_PATH:-/run/secrets/mysql-ca.pem}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    profiles:
      - tools
    volumes:
      - ./secrets/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
    networks:
      - mysql_shared
    command: ["npx", "prisma", "migrate", "deploy"]
    mem_limit: 512m
    cpus: 0.5

networks:
  mysql_shared:
    external: true
  traefik:
    external: true
